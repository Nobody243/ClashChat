name: Build and Release ClashChat

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Build Configurations & Credentials
        env:
          APP_SHARED_SECRET: ${{ secrets.APP_SHARED_SECRET || 'b3bb560a824e4d36bb51e1bae2a75cd51a4dd9b4d4884d4c8e64bbf4fa26676b' }}
        run: |
          # 1. Restore env file
          echo "APP_SHARED_SECRET=$APP_SHARED_SECRET" > env

          # 2. Restore lib/firebase_options.dart
          mkdir -p lib
          cat << 'EOF' > lib/firebase_options.dart
          import 'package:firebase_core/firebase_core.dart';
          import 'package:flutter/foundation.dart'
              show defaultTargetPlatform, kIsWeb, TargetPlatform;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform {
              if (kIsWeb) {
                return web;
              }
              switch (defaultTargetPlatform) {
                case TargetPlatform.android:
                  return android;
                case TargetPlatform.iOS:
                case TargetPlatform.macOS:
                case TargetPlatform.windows:
                case TargetPlatform.linux:
                case TargetPlatform.fuchsia:
                  throw UnsupportedError(
                    'DefaultFirebaseOptions have not been configured for this platform - '
                    'run flutterfire configure to generate platform-specific options.',
                  );
              }
            }

            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'AIzaSyBQMAskTNY3c850tNajJk-Rp8b5Vsd5G8w',
              appId: '1:308163713864:android:5bd8ba9d8cd350ad81317d',
              messagingSenderId: '308163713864',
              projectId: 'clashchat-54dc0',
              storageBucket: 'clashchat-54dc0.firebasestorage.app',
            );

            static const FirebaseOptions web = FirebaseOptions(
              apiKey: 'AIzaSyCqb6oxeOMr7gkV-E8brUkzFuebtq0umD0',
              appId: '1:308163713864:web:ba5dc847410a875281317d',
              messagingSenderId: '308163713864',
              projectId: 'clashchat-54dc0',
              storageBucket: 'clashchat-54dc0.firebasestorage.app',
              authDomain: 'clashchat-54dc0.firebaseapp.com',
              databaseURL: 'https://clashchat-54dc0-default-rtdb.asia-southeast1.firebasedatabase.app',
              measurementId: 'G-TSL0RL1CK9',
            );
          }
          EOF

          # 3. Restore android/app/google-services.json
          mkdir -p android/app
          cat << 'EOF' > android/app/google-services.json
          {
            "project_info": {
              "project_number": "308163713864",
              "firebase_url": "https://clashchat-54dc0-default-rtdb.asia-southeast1.firebasedatabase.app",
              "project_id": "clashchat-54dc0",
              "storage_bucket": "clashchat-54dc0.firebasestorage.app"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:308163713864:android:5bd8ba9d8cd350ad81317d",
                  "android_client_info": {
                    "package_name": "com.SUcoders.clashchat"
                  }
                },
                "oauth_client": [
                  {
                    "client_id": "308163713864-gh8s30t5lvp2b6thvo25m42a1g2eu20u.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.SUcoders.clashchat",
                      "certificate_hash": "ff38d3b7f9a88150ed04d9a7df4da68b695f0b26"
                    }
                  },
                  {
                    "client_id": "308163713864-ghqlhuvkp622acfu30o3dlubd33pimca.apps.googleusercontent.com",
                    "client_type": 1,
                    "android_info": {
                      "package_name": "com.SUcoders.clashchat",
                      "certificate_hash": "eda74be20b9c8ea872ae7cbb7bb37f5c723f6eb1"
                    }
                  },
                  {
                    "client_id": "308163713864-930lujbb5030d0ou9fgh2cr28acm2o3p.apps.googleusercontent.com",
                    "client_type": 3
                  }
                ],
                "api_key": [
                  {
                    "current_key": "AIzaSyBQMAskTNY3c850tNajJk-Rp8b5Vsd5G8w"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": [
                      {
                        "client_id": "308163713864-930lujbb5030d0ou9fgh2cr28acm2o3p.apps.googleusercontent.com",
                        "client_type": 3
                      }
                    }
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clashchat-web
          path: build/web/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clashchat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
