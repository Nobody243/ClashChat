name: Build and Release ClashChat

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build APK & Web
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Restore Build Configurations & Credentials
        env:
          APP_SHARED_SECRET: ${{ secrets.APP_SHARED_SECRET || 'b3bb560a824e4d36bb51e1bae2a75cd51a4dd9b4d4884d4c8e64bbf4fa26676b' }}
          FB_B64: ${{ secrets.FIREBASE_OPTIONS_B64 || '' }}
          GS_B64: ${{ secrets.GOOGLE_SERVICES_B64 || '' }}
        run: |
          # 1. Restore env file
          echo "APP_SHARED_SECRET=$APP_SHARED_SECRET" > env

          # 2. Restore lib/firebase_options.dart
          mkdir -p lib
          echo "$FB_B64" | base64 -d > lib/firebase_options.dart

          # 3. Restore android/app/google-services.json
          mkdir -p android/app
          echo "$GS_B64" | base64 -d > android/app/google-services.json

      - name: Install Dependencies
        run: flutter pub get

      - name: Build Web Release
        run: flutter build web --release

      - name: Build Android Release APK
        run: flutter build apk --release

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clashchat-web
          path: build/web/

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: clashchat-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
